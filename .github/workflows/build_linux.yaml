name: Publish PowerShell Build

on:
  push:
    branch: [develop-workflow]

jobs:
  publish-to-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Java setup 
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Build
        run: pwsh ./build.ps1 "3.2.0" -archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifacts
          path: target-packaged/BaRatinAGE-3.2.0_Linux.tar.gz
 
